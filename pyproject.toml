[project]
name = "stp"
version = "0.1.0"
description = "Smart CI Test Prioritization: rank CI tests so failures (esp. first-time failures) surface early"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pandas>=2.2", "pyarrow>=15", "polars>=1.0", "duckdb>=1.0", "numpy>=1.26",
  "scipy>=1.12", "matplotlib>=3.8", "seaborn>=0.13", "jupyter", "nbconvert",
  "ipykernel", "gdown>=5.1", "tqdm", "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
