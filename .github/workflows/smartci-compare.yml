# Example: two parallel jobs on the same commit, so anyone can compare real CI timings.
#   default  pytest -x in pytest's own order
#   smartci  pytest -x --smartci (same tests, most-likely-to-fail files first)
# Each job prints its start time, the moment the first failure was reported, and its end time.
# Copy into the repo under test (e.g. a NetworkX fork). Not run on this research repository itself.
name: smartci-compare
on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ["**.md"]
jobs:
  default:
    if: github.repository != 'OWNER/smart-ci-tcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install the project under test
        run: python -m pip install -e ".[test]" || python -m pip install -e . pytest
      - name: pytest -x (default order)
        run: |
          echo "default: start $(date -u +%H:%M:%S.%N)"
          set +e
          python -m pytest -x -p no:cacheprovider -q -o junit_family=xunit1 --junitxml=default.xml | tee default.log
          code=${PIPESTATUS[0]}
          echo "default: end $(date -u +%H:%M:%S.%N)"
          grep -m1 -E "^(FAILED|ERROR) " default.log && echo "default: first failure line above" || true
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: default-junit, path: "default.*"}
  smartci:
    if: github.repository != 'OWNER/smart-ci-tcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install the project under test
        run: python -m pip install -e ".[test]" || python -m pip install -e . pytest
      - uses: actions/cache@v4
        with:
          path: .smartci
          key: smartci-${{ runner.os }}-${{ github.run_id }}
          restore-keys: smartci-${{ runner.os }}-
      - name: Install smartci
        run: python -m pip install "smartci @ git+https://github.com/OWNER/smart-ci-tcp.git"
      - name: pytest -x --smartci
        run: |
          echo "smartci: start $(date -u +%H:%M:%S.%N)"
          set +e
          python -m pytest -x -p no:cacheprovider -q --smartci --smartci-base "origin/${{ github.base_ref || github.event.repository.default_branch }}" \
            -o junit_family=xunit1 --junitxml=smartci.xml | tee smartci.log
          code=${PIPESTATUS[0]}
          echo "smartci: end $(date -u +%H:%M:%S.%N)"
          grep -m1 -E "^(FAILED|ERROR) " smartci.log && echo "smartci: first failure line above" || true
          python - <<'PY'
          import glob, json
          r = json.load(open(sorted(glob.glob(".smartci/receipts/*.json"))[-1]))
          print("smartci: first failure after", (r.get("first_failure") or {}).get("elapsed_s"), "s:",
                (r.get("first_failure") or {}).get("nodeid"))
          PY
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: smartci-receipt, path: ".smartci/receipts/*.json"}
