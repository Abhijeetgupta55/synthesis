# Three parallel jobs on the same commit of a NetworkX fork, so GitHub's own machines time three test orders:
#   default  pytest -x in pytest's own order
#   rule     pytest -x --smartci --smartci-rule changed_files_first   (the simple rule)
#   model    pytest -x --smartci                                       (smartci's model)
#   report   (after the three) job summary + PR comment: top 10 tests with P(fail) and reasons, the failing test's
#            queue position in each order, each job's end-to-end time from the GitHub Actions API
# The .smartci baseline (profile, history, adapter, coverage map from the local NetworkX profile) is committed to the
# fork's `smartci-base` branch as .smartci-baseline/ by live_demo/public_ci/make_branches.py and copied to .smartci/.
# Copied into the fork by make_branches.py; it does nothing on this research repository.
name: smartci-compare
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  actions: read
env:
  SMARTCI_SPEC: "smartci @ git+https://github.com/Abhijeetgupta55/synthesis.git"
  BASE_BRANCH: ${{ github.base_ref || 'smartci-base' }}
jobs:
  default:
    if: github.repository != 'Abhijeetgupta55/synthesis'
    runs-on: ubuntu-latest
    steps: &steps
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install NetworkX and smartci (same in all three jobs)
        run: python -m pip install -e ".[default,test]" "$SMARTCI_SPEC"
      - name: Make the .smartci baseline available
        run: |
          rm -rf .smartci && cp -r .smartci-baseline .smartci
          git fetch --no-tags origin "$BASE_BRANCH" || true
      - name: pytest -x
        run: |
          case "${{ github.job }}" in
            default) FLAGS="--smartci-timing=timing.json" ;;
            rule)    FLAGS="--smartci --smartci-base origin/$BASE_BRANCH --smartci-rule changed_files_first" ;;
            model)   FLAGS="--smartci --smartci-base origin/$BASE_BRANCH" ;;
          esac
          START=$(date +%s.%N)
          set +e
          python -m pytest -x -p no:cacheprovider -q --ignore=.smartci-baseline $FLAGS | tee pytest.log
          CODE=${PIPESTATUS[0]}
          END=$(date +%s.%N)
          if [ "${{ github.job }}" = default ]; then SRC="--timing timing.json"; else SRC="--receipt-dir .smartci/receipts"; fi
          python -m smartci.ci_report job --name ${{ github.job }} $SRC --start $START --end $END --exit-code $CODE \
            --out summary-${{ github.job }}.json
          exit $CODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary-${{ github.job }}
          include-hidden-files: true
          path: |
            summary-*.json
            pytest.log
            .smartci/receipts/*.json
  rule:
    if: github.repository != 'Abhijeetgupta55/synthesis'
    runs-on: ubuntu-latest
    steps: *steps
  model:
    if: github.repository != 'Abhijeetgupta55/synthesis'
    runs-on: ubuntu-latest
    steps: *steps
  report:
    needs: [default, rule, model]
    if: always() && github.repository != 'Abhijeetgupta55/synthesis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --no-deps "$SMARTCI_SPEC"
      - uses: actions/download-artifact@v4
        with: {pattern: "summary-*", path: summaries}
      - name: Job summary and PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" > jobs.json
          python -m smartci.ci_report comment --dir summaries --jobs jobs.json --out comment.md
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file comment.md
          fi
      - uses: actions/upload-artifact@v4
        with: {name: report, path: "comment.md\njobs.json"}
